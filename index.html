const y=document.getElementById('year'),m=document.getElementById('month'),d=document.getElementById('day');for(let i=2026;i>=1940;i--)y.add(new Option(i+'年',i));for(let i=1;i<=12;i++)m.add(new Option(i+'月',i));function days(){let n=new Date(+y.value,+m.value,0).getDate(),old=+d.value||1;d.innerHTML='';for(let i=1;i<=n;i++)d.add(new Option(i+'日',i));d.value=Math.min(old,n)};y.value=1990;m.value=1;days();m.onchange=days;y.onchange=days;
const panel=document.getElementById('panel'),content=document.getElementById('content');function open(html){content.innerHTML=html;panel.classList.add('open');document.body.style.overflow='hidden';panel.scrollTop=0}function close(){panel.classList.remove('open');document.body.style.overflow='';}document.getElementById('back').onclick=close;
function todayIndex(){let now=new Date();return (+y.value*17 + +m.value*31 + +d.value + now.getFullYear()*7 + (now.getMonth()+1)*13 + now.getDate())%12}function renderToday(){let idx=todayIndex(),g=girls[idx],r=document.getElementById('dynamicResult');document.getElementById('dynImg').src=portraits[idx];document.getElementById('dynName').textContent=g[0];document.getElementById('dynTitle').textContent=g[1];document.getElementById('dynStory').textContent=g[2];document.getElementById('dynTheme').textContent=g[3];document.getElementById('dynLore').textContent=g[4];document.getElementById('dynCare').textContent=g[5];document.getElementById('dynScent').textContent=g[6];document.getElementById('dynFood').textContent=g[7];document.getElementById('dynQuote').textContent=g[8];r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}document.getElementById('go').onclick=renderToday;y.onchange=()=>{days();renderToday()};m.onchange=()=>{days();renderToday()};d.onchange=renderToday;renderToday();
const recipeCards=girls.map(g=>`<div class="card"><span class="tag">${g[0]}</span><h2>${g[1]}</h2><p><b>主题：</b>${g[3]}</p><p><b>红楼灵感：</b>${g[4]}</p><p><b>现代护肤：</b>${g[5]}</p></div>`).join('');
const pages={recipes:`<h1>十二钗秘方</h1><p class="quote">十二钗 · 十二种花颜灵感</p>${recipeCards}`,scents:`<h1>红楼香方</h1><div class="card"><h2>玫瑰桃花香</h2><p>玫瑰、桃花、白梅：清雅柔美的花香意象。</p></div><div class="card"><h2>冷香清韵</h2><p>白梅、白檀、桂花：取“冷香”意境，不作为古方复刻。</p></div><div class="card"><h2>清茶梅影</h2><p>白茶、梅、兰：适合营造清淡书房香气。</p></div><p class="note">香方为文学氛围搭配。精油、香精不要直接涂脸，使用香氛时注意过敏与通风。</p>`,food:`<h1>红楼养颜膳</h1>${girls.map(g=>`<div class="card"><h2>${g[0]} · ${g[7]}</h2><p>以清淡、适量、日常食材为原则，作为红楼主题饮食灵感。</p></div>`).join('')}<p class="note">食膳不替代医疗或营养治疗；有糖代谢、过敏等情况应按个人饮食要求调整。</p>`,calendar:`<h1>2026 十二钗月历</h1>${girls.map((g,i)=>`<div class="card"><h2>${i+1}月 · ${g[0]}</h2><p>${g[1]}｜${g[8]}</p></div>`).join('')}`};document.querySelectorAll('.hot button').forEach(b=>b.onclick=()=>open(pages[b.dataset.page]));
</script></body></html>
